[project]
name = "mmm-decision-engine"
version = "0.1.0"
description = "Evidence-gated marketing mix model decision support"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisionguard"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "pyright>=1.1.400,<2", "pytest>=8,<10"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PERF", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
