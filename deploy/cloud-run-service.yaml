# Preparation template only. Replace PROJECT_NUMBER, REGION, CLOUD_SQL_INSTANCE,
# SERVICE_ACCOUNT_EMAIL, IMAGE_DIGEST and ARTIFACT_BUCKET before applying.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: decisionguard-api
  namespace: PROJECT_NUMBER
  labels:
    cloud.googleapis.com/location: REGION
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: CLOUD_SQL_INSTANCE
        autoscaling.knative.dev/maxScale: "2"
    spec:
      serviceAccountName: SERVICE_ACCOUNT_EMAIL
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: APP_ENV
              value: production
            - name: READ_ONLY
              value: "true"
            - name: ARTIFACT_ROOT
              value: /artifacts
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: decisionguard-database-url
                  key: "1"
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: decisionguard-api-token
                  key: "1"
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: ARTIFACT_BUCKET
